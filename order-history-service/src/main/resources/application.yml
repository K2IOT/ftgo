spring:
  application:
    name: order-history-service
  cassandra:
    contact-points: localhost
    port: 9042
    keyspace-name: ftgo_order_history
    local-datacenter: datacenter1
    schema-action: create-if-not-exists
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-history-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FTGO_SECURITY_ISSUER_URI:http://localhost:9000/realms/ftgo}
          jwk-set-uri: ${FTGO_SECURITY_JWK_SET_URI:http://localhost:9000/realms/ftgo/protocol/openid-connect/certs}

ftgo:
  security:
    public-audience: ${FTGO_SECURITY_PUBLIC_AUDIENCE:ftgo-api}
    internal-audience: ${FTGO_SECURITY_INTERNAL_AUDIENCE:ftgo-internal}
  order-history:
    paging-secret: ${FTGO_ORDER_HISTORY_PAGING_SECRET:}
    paging-token-ttl: ${FTGO_ORDER_HISTORY_PAGING_TOKEN_TTL:PT15M}
    max-bucket-reads: ${FTGO_ORDER_HISTORY_MAX_BUCKET_READS:24}

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
