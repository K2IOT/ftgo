spring:
  application:
    name: order-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FTGO_SECURITY_ISSUER_URI:http://localhost:9000/realms/ftgo}
          jwk-set-uri: ${FTGO_SECURITY_JWK_SET_URI:http://localhost:9000/realms/ftgo/protocol/openid-connect/certs}

eventuate:
  database:
    schema: none

eventuatelocal:
  kafka:
    bootstrap:
      servers: localhost:9092
  cdc:
    reader:
      name: MySqlReader

ftgo:
  security:
    public-audience: ${FTGO_SECURITY_PUBLIC_AUDIENCE:ftgo-api}
    internal-audience: ${FTGO_SECURITY_INTERNAL_AUDIENCE:ftgo-internal}
  messaging:
    retention:
      enabled: ${FTGO_MESSAGE_RETENTION_ENABLED:false}
      outbox-retention: ${FTGO_MESSAGE_RETENTION_OUTBOX_RETENTION:P30D}
      completed-command-retention: ${FTGO_MESSAGE_RETENTION_COMPLETED_COMMAND_RETENTION:P30D}
      batch-size: ${FTGO_MESSAGE_RETENTION_BATCH_SIZE:500}
      interval: ${FTGO_MESSAGE_RETENTION_INTERVAL:PT10M}
  order:
    max-scheduling-window: ${FTGO_ORDER_MAX_SCHEDULING_WINDOW:PT168H}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    net.ftgo: INFO
    org.springframework: INFO
