spring:
  application:
    name: api-gateway-test
  main:
    allow-bean-definition-overriding: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
  cloud:
    gateway:
      routes:
        - id: test-route
          uri: http://localhost:9999
          predicates:
            - Path=/test/**
  redis:
    host: localhost
    port: 6379

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# Resilience4j Circuit Breaker Configuration for Testing
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 1s  # Shorter for testing
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
    instances:
      orderServiceCircuitBreaker:
        baseConfig: default
      consumerServiceCircuitBreaker:
        baseConfig: default
      restaurantServiceCircuitBreaker:
        baseConfig: default
      kitchenServiceCircuitBreaker:
        baseConfig: default
      accountingServiceCircuitBreaker:
        baseConfig: default
      deliveryServiceCircuitBreaker:
        baseConfig: default
      orderHistoryServiceCircuitBreaker:
        baseConfig: default
      orderDetails:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

# Service URLs for API composition testing
services:
  order-service:
    url: http://localhost:8091
  consumer-service:
    url: http://localhost:8092
  restaurant-service:
    url: http://localhost:8093
  kitchen-service:
    url: http://localhost:8094
  accounting-service:
    url: http://localhost:8095
  delivery-service:
    url: http://localhost:8096
  order-history-service:
    url: http://localhost:8097

# WebClient config for tests
webclient:
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  max-connections: 50
  max-idle-time-ms: 10000
