spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 256KB
  cloud:
    gateway:
      # Global defaults
      default-filters:
        - TokenRelay
        - name: RequestSize
          args:
            maxSize: 256KB
      routes:
        - id: order-service
          uri: ${services.order-service.url:http://localhost:8081}
          predicates:
            - Path=/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceCircuitBreaker
                fallbackUri: forward:/fallback/orders
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: false
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: consumer-admin
          uri: ${services.consumer-service.url:http://localhost:8082}
          predicates:
            - Path=/admin/consumers/**
          filters:
            - name: CircuitBreaker
              args:
                name: consumerServiceCircuitBreaker
                fallbackUri: forward:/fallback/consumers
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: true
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 1500ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: consumer-service
          uri: ${services.consumer-service.url:http://localhost:8082}
          predicates:
            - Path=/consumers/**
          filters:
            - name: CircuitBreaker
              args:
                name: consumerServiceCircuitBreaker
                fallbackUri: forward:/fallback/consumers
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: false
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: restaurant-service
          uri: ${services.restaurant-service.url:http://localhost:8083}
          predicates:
            - Path=/restaurants/**
          filters:
            - name: CircuitBreaker
              args:
                name: restaurantServiceCircuitBreaker
                fallbackUri: forward:/fallback/restaurants
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: false
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: kitchen-service
          uri: ${services.kitchen-service.url:http://localhost:8084}
          predicates:
            - Path=/tickets/**
          filters:
            - name: CircuitBreaker
              args:
                name: kitchenServiceCircuitBreaker
                fallbackUri: forward:/fallback/tickets
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: false
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: accounting-service
          uri: ${services.accounting-service.url:http://localhost:8085}
          predicates:
            - Path=/accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountingServiceCircuitBreaker
                fallbackUri: forward:/fallback/accounts
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: false
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
                  basedOnPreviousValue: false

        - id: payment-settlement-admin
          uri: ${services.accounting-service.url:http://localhost:8085}
          predicates:
            - Path=/api/admin/payment-settlement/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountingServiceCircuitBreaker
                fallbackUri: forward:/fallback/accounts
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: true

        - id: delivery-service
          uri: ${services.delivery-service.url:http://localhost:8086}
          predicates:
            - Path=/deliveries/**
          filters:
            - name: CircuitBreaker
              args:
                name: deliveryServiceCircuitBreaker
                fallbackUri: forward:/fallback/deliveries
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: false
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
                  basedOnPreviousValue: false

        # Order History Service uses @RequestMapping("/api") with endpoints
        # /api/orders/{id} and /api/consumers/{consumerId}/orders.
        - id: order-history-service
          uri: ${services.order-history-service.url:http://localhost:8087}
          predicates:
            - Path=/order-history/**
          filters:
            - RewritePath=/order-history(?<segment>/?.*), /api${segment}
            - name: CircuitBreaker
              args:
                name: orderHistoryServiceCircuitBreaker
                fallbackUri: forward:/fallback/order-history
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: false
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2000ms
                  factor: 2
                  basedOnPreviousValue: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 1000ms
  session:
    store-type: redis
    redis:
      namespace: ftgo:session
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FTGO_SECURITY_ISSUER_URI:http://localhost:9000/realms/ftgo}
          jwk-set-uri: ${FTGO_SECURITY_JWK_SET_URI:http://localhost:9000/realms/ftgo/protocol/openid-connect/certs}

ftgo:
  gateway:
    trusted-proxies: ${FTGO_GATEWAY_TRUSTED_PROXIES:}
  security:
    public-audience: ${FTGO_SECURITY_PUBLIC_AUDIENCE:ftgo-api}
    internal-audience: ${FTGO_SECURITY_INTERNAL_AUDIENCE:ftgo-internal}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  netty:
    connection-timeout: 5s
    idle-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.cloud.gateway.filter.factory.SpringCloudCircuitBreakerFilterFactory$CircuitBreakerStatusCodeException
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - io.netty.channel.ConnectTimeoutException
    instances:
      orderServiceCircuitBreaker:
        baseConfig: default
      consumerServiceCircuitBreaker:
        baseConfig: default
      restaurantServiceCircuitBreaker:
        baseConfig: default
      kitchenServiceCircuitBreaker:
        baseConfig: default
      accountingServiceCircuitBreaker:
        baseConfig: default
      deliveryServiceCircuitBreaker:
        baseConfig: default
      orderHistoryServiceCircuitBreaker:
        baseConfig: default
      orderDetails:
        baseConfig: default
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

services:
  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8081}
  consumer-service:
    url: ${CONSUMER_SERVICE_URL:http://localhost:8082}
  restaurant-service:
    url: ${RESTAURANT_SERVICE_URL:http://localhost:8083}
  kitchen-service:
    url: ${KITCHEN_SERVICE_URL:http://localhost:8084}
  accounting-service:
    url: ${ACCOUNTING_SERVICE_URL:http://localhost:8085}
  delivery-service:
    url: ${DELIVERY_SERVICE_URL:http://localhost:8086}
  order-history-service:
    url: ${ORDER_HISTORY_SERVICE_URL:http://localhost:8087}

webclient:
  connect-timeout-ms: 3000
  read-timeout-ms: 5000
  max-connections: 500
  max-idle-time-ms: 20000

logging:
  level:
    root: INFO
    net.ftgo: DEBUG
    org.springframework.cloud.gateway: DEBUG
    io.github.resilience4j: DEBUG
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","service":"${spring.application.name}","trace":"%X{traceId:-}","span":"%X{spanId:-}","requestId":"%X{requestId:-}","thread":"%thread","class":"%logger{36}","message":"%msg"}%n'
