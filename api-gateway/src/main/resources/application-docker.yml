# Docker Compose profile — uses container hostnames
spring:
  redis:
    host: redis
    port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://auth-server:9000}

ftgo:
  gateway:
    cors:
      allowed-origins: "${FTGO_CORS_ALLOWED_ORIGINS:}"
      allowed-methods: "${FTGO_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}"
      allow-credentials: ${FTGO_CORS_ALLOW_CREDENTIALS:false}
      max-age: ${FTGO_CORS_MAX_AGE:1h}

services:
  order-service:
    url: http://order-service:8081
  consumer-service:
    url: http://consumer-service:8082
  restaurant-service:
    url: http://restaurant-service:8083
  kitchen-service:
    url: http://kitchen-service:8084
  accounting-service:
    url: http://accounting-service:8085
  delivery-service:
    url: http://delivery-service:8086
  order-history-service:
    url: http://order-history-service:8087
