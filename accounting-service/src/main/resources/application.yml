spring:
  application:
    name: accounting-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3310/ftgo_accounting?createDatabaseIfNotExist=true
    username: ftgo_user
    password: ftgo_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: accounting-service

eventuate:
  database:
    schema: none

eventuatelocal:
  kafka:
    bootstrap:
      servers: ${spring.kafka.bootstrap-servers}
  cdc:
    reader:
      name: MySqlReader

ftgo:
  accounting:
    declined-payment-tokens: ${FTGO_ACCOUNTING_DECLINED_PAYMENT_TOKENS:}
    payment-webhook-secrets: sandbox=${FTGO_ACCOUNTING_SANDBOX_WEBHOOK_SECRET:change-me}
    webhook-replay-window-seconds: ${FTGO_ACCOUNTING_WEBHOOK_REPLAY_WINDOW_SECONDS:300}
    # Finite provider retry schedule in milliseconds. The initial call is followed
    # by retries after 1s, 5s and 30s before returning a deterministic failure.
    payment-provider-retry-delays-ms: ${FTGO_ACCOUNTING_PAYMENT_PROVIDER_RETRY_DELAYS_MS:1000,5000,30000}

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
