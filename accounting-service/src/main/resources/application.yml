spring:
  application:
    name: accounting-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3310/ftgo_accounting?createDatabaseIfNotExist=true
    username: ftgo_user
    password: ftgo_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: accounting-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FTGO_SECURITY_ISSUER_URI:http://localhost:9000/realms/ftgo}
          jwk-set-uri: ${FTGO_SECURITY_JWK_SET_URI:http://localhost:9000/realms/ftgo/protocol/openid-connect/certs}

eventuate:
  database:
    schema: none

eventuatelocal:
  kafka:
    bootstrap:
      servers: ${spring.kafka.bootstrap-servers}
  cdc:
    reader:
      name: MySqlReader

ftgo:
  security:
    public-audience: ${FTGO_SECURITY_PUBLIC_AUDIENCE:ftgo-api}
    internal-audience: ${FTGO_SECURITY_INTERNAL_AUDIENCE:ftgo-internal}
  accounting:
    declined-payment-tokens: ${FTGO_ACCOUNTING_DECLINED_PAYMENT_TOKENS:}
    kafka:
      concurrency: ${FTGO_ACCOUNTING_KAFKA_CONCURRENCY:4}
      topic-partitions: ${FTGO_ACCOUNTING_KAFKA_TOPIC_PARTITIONS:4}
    settlement:
      deny-request-ids: ${FTGO_ACCOUNTING_SETTLEMENT_DENY_REQUEST_IDS:}
      timeout-once-request-ids: ${FTGO_ACCOUNTING_SETTLEMENT_TIMEOUT_ONCE_REQUEST_IDS:}
      timeout-always-request-ids: ${FTGO_ACCOUNTING_SETTLEMENT_TIMEOUT_ALWAYS_REQUEST_IDS:}
      retry-delays-ms: ${FTGO_ACCOUNTING_SETTLEMENT_RETRY_DELAYS_MS:1000,5000,30000}
      reconciliation:
        enabled: ${FTGO_ACCOUNTING_SETTLEMENT_RECONCILIATION_ENABLED:true}
        interval-ms: ${FTGO_ACCOUNTING_SETTLEMENT_RECONCILIATION_INTERVAL_MS:60000}
        initial-delay-ms: ${FTGO_ACCOUNTING_SETTLEMENT_RECONCILIATION_INITIAL_DELAY_MS:30000}

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
