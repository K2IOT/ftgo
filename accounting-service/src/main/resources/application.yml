spring:
  application:
    name: accounting-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3310/ftgo_accounting?createDatabaseIfNotExist=true
    username: ftgo_user
    password: ftgo_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: accounting-service

eventuate:
  database:
    schema: none

eventuatelocal:
  kafka:
    bootstrap:
      servers: ${spring.kafka.bootstrap-servers}
  cdc:
    reader:
      name: MySqlReader

ftgo:
  accounting:
    declined-payment-tokens: ${FTGO_ACCOUNTING_DECLINED_PAYMENT_TOKENS:}

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
