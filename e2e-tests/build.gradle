description = 'Real-process verification for distributed FTGO consistency'

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    testImplementation 'org.apache.kafka:kafka-clients'
    testImplementation "com.nimbusds:nimbus-jose-jwt:${rootProject.ext.nimbusJoseJwtVersion}"
}

tasks.named('test') {
    onlyIf {
        System.getenv('FTGO_E2E_ENABLED') == 'true'
            || System.getenv('FTGO_PHASE02B_E2E_ENABLED') == 'true'
    }
}
