spring:
  application:
    name: kitchen-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3309/ftgo_kitchen?createDatabaseIfNotExist=true
    username: ftgo_user
    password: ftgo_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: kitchen-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FTGO_SECURITY_ISSUER_URI:http://localhost:9000/realms/ftgo}
          jwk-set-uri: ${FTGO_SECURITY_JWK_SET_URI:http://localhost:9000/realms/ftgo/protocol/openid-connect/certs}

eventuate:
  database:
    schema: none

eventuatelocal:
  kafka:
    bootstrap:
      servers: ${spring.kafka.bootstrap-servers}
  cdc:
    reader:
      name: MySqlReader

ftgo:
  security:
    public-audience: ${FTGO_SECURITY_PUBLIC_AUDIENCE:ftgo-api}
    internal-audience: ${FTGO_SECURITY_INTERNAL_AUDIENCE:ftgo-internal}
  messaging:
    retention:
      enabled: ${FTGO_MESSAGE_RETENTION_ENABLED:false}
      outbox-retention: ${FTGO_MESSAGE_RETENTION_OUTBOX_RETENTION:P30D}
      completed-command-retention: ${FTGO_MESSAGE_RETENTION_COMPLETED_COMMAND_RETENTION:P30D}
      batch-size: ${FTGO_MESSAGE_RETENTION_BATCH_SIZE:500}
      interval: ${FTGO_MESSAGE_RETENTION_INTERVAL:PT10M}
  kitchen:
    acceptance-timeout-scan-ms: 5000
    acceptance-timeout-batch-size: 100

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
