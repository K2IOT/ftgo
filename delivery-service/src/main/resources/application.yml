spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:mysql://localhost:3311/ftgo_delivery?createDatabaseIfNotExist=true
    username: ftgo_user
    password: ftgo_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: delivery-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FTGO_SECURITY_ISSUER_URI:http://localhost:9000/realms/ftgo}
          jwk-set-uri: ${FTGO_SECURITY_JWK_SET_URI:http://localhost:9000/realms/ftgo/protocol/openid-connect/certs}

ftgo:
  security:
    public-audience: ${FTGO_SECURITY_PUBLIC_AUDIENCE:ftgo-api}
    internal-audience: ${FTGO_SECURITY_INTERNAL_AUDIENCE:ftgo-internal}

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
