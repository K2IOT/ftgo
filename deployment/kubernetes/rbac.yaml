apiVersion: v1
kind: ServiceAccount
metadata:
  name: ftgo-service-account
  namespace: ftgo-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ftgo-service-role
  namespace: ftgo-production
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ftgo-service-rolebinding
  namespace: ftgo-production
subjects:
  - kind: ServiceAccount
    name: ftgo-service-account
    namespace: ftgo-production
roleRef:
  kind: Role
  name: ftgo-service-role
  apiGroup: rbac.authorization.k8s.io
