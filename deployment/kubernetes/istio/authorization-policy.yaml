apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-operational-services
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: ftgo
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/ftgo-dev/sa/api-gateway
              - cluster.local/ns/ftgo-staging/sa/api-gateway
              - cluster.local/ns/ftgo-production/sa/api-gateway
