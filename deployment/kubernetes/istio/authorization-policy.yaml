              - cluster.local/ns/ftgo-staging/sa/order-service
              - cluster.local/ns/ftgo-production/sa/order-service
      to:
        - operation:
            paths:
              - /api/*
              - /internal/*
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/prometheus
      to:
        - operation:
            paths:
              - /actuator/health/*
              - /actuator/prometheus
