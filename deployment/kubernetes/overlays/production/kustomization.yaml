apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ftgo-production
resources:
  - ../../../base
replicas:
  - name: api-gateway
    count: 3
  - name: order-service
    count: 3
  - name: consumer-service
    count: 2
  - name: restaurant-service
    count: 2
  - name: kitchen-service
    count: 2
  - name: accounting-service
    count: 2
  - name: delivery-service
    count: 2
  - name: order-history-service
    count: 2
images:
  - name: ftgo/api-gateway
    newName: registry.example.invalid/ftgo/api-gateway
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  - name: ftgo/order-service
    newName: registry.example.invalid/ftgo/order-service
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  - name: ftgo/consumer-service
    newName: registry.example.invalid/ftgo/consumer-service
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  - name: ftgo/restaurant-service
    newName: registry.example.invalid/ftgo/restaurant-service
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  - name: ftgo/kitchen-service
    newName: registry.example.invalid/ftgo/kitchen-service
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  - name: ftgo/accounting-service
    newName: registry.example.invalid/ftgo/accounting-service
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  - name: ftgo/delivery-service
    newName: registry.example.invalid/ftgo/delivery-service
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  - name: ftgo/order-history-service
    newName: registry.example.invalid/ftgo/order-history-service
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
patches:
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: order-service
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
