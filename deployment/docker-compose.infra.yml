x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.5.0
  restart: unless-stopped
  environment: &kafka-common-environment
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_LOG_RETENTION_MS: 604800000
    KAFKA_COMPRESSION_TYPE: snappy
    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 30s
  networks:
    - ftgo-network

x-mysql-common: &mysql-common
  image: mysql:8.0.36
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s
  networks:
    - ftgo-network

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    container_name: ftgo-kafka-1
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      <<: *kafka-common-environment
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    container_name: ftgo-kafka-2
    ports:
      - "9094:9092"
      - "19093:19093"
    environment:
      <<: *kafka-common-environment
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:19093
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    container_name: ftgo-kafka-3
    ports:
      - "9095:9092"
      - "19094:19094"
    environment:
      <<: *kafka-common-environment
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:19094
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ftgo-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command: |
      topics=(
        net.ftgo.orderservice.domain.Order
        net.ftgo.consumerservice.domain.Consumer
        net.ftgo.restaurantservice.domain.Restaurant
        net.ftgo.kitchenservice.domain.Ticket
        net.ftgo.accountingservice.domain.Account
        net.ftgo.deliveryservice.domain.Delivery
        orderService
        consumerService
        kitchenService
        accountingService
        deliveryService
        createOrderSagaReply
        cancelOrderSagaReply
        reviseOrderSagaReply
      )
      for topic in "$${topics[@]}"; do
        kafka-topics --create --if-not-exists \
          --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
          --topic "$${topic}" --partitions 3 --replication-factor 3
      done
    networks:
      - ftgo-network

  mysql-order:
    <<: *mysql-common
    container_name: ftgo-mysql-order
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${FTGO_MYSQL_ROOT_PASSWORD:?Copy deployment/.env.example to deployment/.env}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ftgo_order
      MYSQL_USER: "${FTGO_MYSQL_USER:?FTGO_MYSQL_USER is required}"
      MYSQL_PASSWORD: "${FTGO_MYSQL_PASSWORD:?FTGO_MYSQL_PASSWORD is required}"
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL"]
    volumes:
      - mysql-order-data:/var/lib/mysql

  mysql-consumer:
    <<: *mysql-common
    container_name: ftgo-mysql-consumer
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${FTGO_MYSQL_ROOT_PASSWORD:?Copy deployment/.env.example to deployment/.env}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ftgo_consumer
      MYSQL_USER: "${FTGO_MYSQL_USER:?FTGO_MYSQL_USER is required}"
      MYSQL_PASSWORD: "${FTGO_MYSQL_PASSWORD:?FTGO_MYSQL_PASSWORD is required}"
    command: ["--server-id=2", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL"]
    volumes:
      - mysql-consumer-data:/var/lib/mysql

  mysql-restaurant:
    <<: *mysql-common
    container_name: ftgo-mysql-restaurant
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${FTGO_MYSQL_ROOT_PASSWORD:?Copy deployment/.env.example to deployment/.env}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ftgo_restaurant
      MYSQL_USER: "${FTGO_MYSQL_USER:?FTGO_MYSQL_USER is required}"
      MYSQL_PASSWORD: "${FTGO_MYSQL_PASSWORD:?FTGO_MYSQL_PASSWORD is required}"
    command: ["--server-id=3", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL"]
    volumes:
      - mysql-restaurant-data:/var/lib/mysql

  mysql-kitchen:
    <<: *mysql-common
    container_name: ftgo-mysql-kitchen
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${FTGO_MYSQL_ROOT_PASSWORD:?Copy deployment/.env.example to deployment/.env}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ftgo_kitchen
      MYSQL_USER: "${FTGO_MYSQL_USER:?FTGO_MYSQL_USER is required}"
      MYSQL_PASSWORD: "${FTGO_MYSQL_PASSWORD:?FTGO_MYSQL_PASSWORD is required}"
    command: ["--server-id=4", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL"]
    volumes:
      - mysql-kitchen-data:/var/lib/mysql

  mysql-accounting:
    <<: *mysql-common
    container_name: ftgo-mysql-accounting
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${FTGO_MYSQL_ROOT_PASSWORD:?Copy deployment/.env.example to deployment/.env}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ftgo_accounting
      MYSQL_USER: "${FTGO_MYSQL_USER:?FTGO_MYSQL_USER is required}"
      MYSQL_PASSWORD: "${FTGO_MYSQL_PASSWORD:?FTGO_MYSQL_PASSWORD is required}"
    command: ["--server-id=5", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL"]
    volumes:
      - mysql-accounting-data:/var/lib/mysql

  mysql-delivery:
    <<: *mysql-common
    container_name: ftgo-mysql-delivery
    ports:
      - "3311:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${FTGO_MYSQL_ROOT_PASSWORD:?Copy deployment/.env.example to deployment/.env}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ftgo_delivery
      MYSQL_USER: "${FTGO_MYSQL_USER:?FTGO_MYSQL_USER is required}"
      MYSQL_PASSWORD: "${FTGO_MYSQL_PASSWORD:?FTGO_MYSQL_PASSWORD is required}"
    command: ["--server-id=6", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL"]
    volumes:
      - mysql-delivery-data:/var/lib/mysql

  scylladb:
    image: scylladb/scylla:5.4
    container_name: ftgo-scylladb
    restart: unless-stopped
    ports:
      - "9042:9042"
    command: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--developer-mode", "1"]
    volumes:
      - scylladb-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh $$(hostname -i) 9042 -e 'DESCRIBE CLUSTER' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    networks:
      - ftgo-network

  redis:
    image: redis:7.2.4-alpine
    container_name: ftgo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ftgo-network

  debezium:
    image: debezium/connect:2.5
    container_name: ftgo-debezium
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mysql-order:
        condition: service_healthy
      mysql-consumer:
        condition: service_healthy
      mysql-restaurant:
        condition: service_healthy
      mysql-kitchen:
        condition: service_healthy
      mysql-accounting:
        condition: service_healthy
      mysql-delivery:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - ftgo-network

  vault:
    image: hashicorp/vault:1.15.6
    container_name: ftgo-vault
    restart: unless-stopped
    command: server -dev
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${FTGO_VAULT_DEV_ROOT_TOKEN:?FTGO_VAULT_DEV_ROOT_TOKEN is required}"
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - ftgo-network

  config-server:
    image: hyness/spring-cloud-config-server:4.1.0
    container_name: ftgo-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:///config
    volumes:
      - ./config-repo:/config:ro
    networks:
      - ftgo-network

networks:
  ftgo-network:
    driver: bridge

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  mysql-order-data:
  mysql-consumer-data:
  mysql-restaurant-data:
  mysql-kitchen-data:
  mysql-accounting-data:
  mysql-delivery-data:
  scylladb-data:
