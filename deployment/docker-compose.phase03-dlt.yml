version: '3.8'

services:
  kafka-dlt-init:
    image: bitnami/kafka:latest
    container_name: ftgo-kafka-dlt-init
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    entrypoint: ['/bin/bash', '-c']
    command: |
      "
      until kafka-broker-api-versions.sh --bootstrap-server kafka-1:9092 >/dev/null 2>&1; do
        echo 'Waiting for Kafka before provisioning Phase 03 DLT topics...'
        sleep 5
      done

      for topic in \
        net.ftgo.orderservice.domain.Order.DLT \
        net.ftgo.consumerservice.domain.Consumer.DLT \
        net.ftgo.restaurantservice.domain.Restaurant.DLT \
        net.ftgo.kitchenservice.domain.Ticket.DLT \
        net.ftgo.accountingservice.domain.Account.DLT \
        net.ftgo.deliveryservice.domain.Delivery.DLT
      do
        kafka-topics.sh --create --if-not-exists \
          --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
          --topic \"$${topic}\" \
          --partitions 3 \
          --replication-factor 3 \
          --config retention.ms=1209600000 \
          --config compression.type=snappy
      done

      echo 'Phase 03 DLT topics created successfully'
      "
    networks:
      - ftgo-network
