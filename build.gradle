plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    nimbusJoseJwtVersion = '9.37.4'
    restAssuredVersion = '6.0.1'
    nettyVersion = '4.2.16.Final'
}

allprojects {
    group = 'net.ftgo'
    version = '1.0.0-SNAPSHOT'
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    configurations.configureEach {
        exclude group: 'mysql', module: 'mysql-connector-java'
        exclude group: 'org.postgresql', module: 'postgresql'
        exclude group: 'com.microsoft.sqlserver', module: 'mssql-jdbc'
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-validation'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.testcontainers:testcontainers'
        testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
        testImplementation 'org.testcontainers:testcontainers-kafka'
        testImplementation 'org.testcontainers:testcontainers-mysql'
        testImplementation 'net.jqwik:jqwik:1.8.2'
        testImplementation "io.rest-assured:rest-assured:${rootProject.ext.restAssuredVersion}"
        testImplementation 'org.awaitility:awaitility'
        testRuntimeOnly 'com.h2database:h2'
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.2'
            mavenBom 'io.eventuate.platform:eventuate-platform-dependencies:2024.0.RELEASE'
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        systemProperty 'jqwik.tries.default', '100'
        systemProperty 'jqwik.reporting.usejunitplatform', 'true'
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }
}

project(':common') {
    bootJar { enabled = false }
    jar { enabled = true }
}

configure(subprojects.findAll {
    it.name != 'common' && it.name != 'api-gateway' && it.name != 'e2e-tests'
}) {
    dependencies {
        implementation project(':common')
        implementation 'org.springframework.boot:spring-boot-starter-webmvc'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.security:spring-security-oauth2-resource-server'
        implementation 'org.springframework.security:spring-security-oauth2-jose'
        implementation 'org.springframework.kafka:spring-kafka'
        implementation 'io.eventuate.tram.core:eventuate-tram-spring-messaging'
        implementation 'io.eventuate.tram.core:eventuate-tram-spring-events'
        implementation 'io.eventuate.tram.core:eventuate-tram-spring-commands'
        implementation 'io.micrometer:micrometer-registry-prometheus'
        implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:2.0.0'
        implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
        testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
        testImplementation 'org.springframework.kafka:spring-kafka-test'
        testImplementation 'org.springframework.security:spring-security-test'
    }
}

project(':order-service') {
    dependencies {
        implementation 'io.eventuate.tram.sagas:eventuate-tram-sagas-spring-orchestration-simple-dsl'
        implementation 'io.eventuate.tram.sagas:eventuate-tram-sagas-spring-participant'
        implementation 'io.eventuate.tram.core:eventuate-tram-spring-jdbc-kafka'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'com.mysql:mysql-connector-j'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-mysql'
        testImplementation 'io.eventuate.tram.sagas:eventuate-tram-sagas-testing-support'
        testImplementation project(':consumer-service')
        testImplementation project(':kitchen-service')
        testImplementation project(':accounting-service')
    }
}

project(':consumer-service') {
    dependencies {
        implementation 'io.eventuate.tram.sagas:eventuate-tram-sagas-spring-participant'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'com.mysql:mysql-connector-j'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-mysql'
    }
}

project(':restaurant-service') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'com.mysql:mysql-connector-j'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-mysql'
    }
}

project(':kitchen-service') {
    dependencies {
        implementation 'io.eventuate.tram.sagas:eventuate-tram-sagas-spring-participant'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'com.mysql:mysql-connector-j'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-mysql'
    }
}

project(':accounting-service') {
    dependencies {
        implementation 'io.eventuate.tram.sagas:eventuate-tram-sagas-spring-participant'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'com.mysql:mysql-connector-j'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-mysql'
    }
}

project(':delivery-service') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'com.mysql:mysql-connector-j'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-mysql'
    }
}

project(':order-history-service') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-cassandra'
        testImplementation 'org.testcontainers:testcontainers-cassandra'
    }
}

project(':api-gateway') {
    dependencies {
        implementation project(':common')
        implementation enforcedPlatform("io.netty:netty-bom:${rootProject.ext.nettyVersion}")
        implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
        implementation 'org.springframework.security:spring-security-oauth2-resource-server'
        implementation 'org.springframework.security:spring-security-oauth2-jose'
        implementation 'io.micrometer:micrometer-registry-prometheus'
        testImplementation 'org.springframework.security:spring-security-test'
        testImplementation 'com.nimbusds:nimbus-jose-jwt'
        testImplementation 'org.wiremock:wiremock-standalone:3.3.1'
        testImplementation 'org.testcontainers:testcontainers'
        testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
        testImplementation 'io.projectreactor:reactor-test'
    }
}

project(':e2e-tests') {
    bootJar { enabled = false }
    jar { enabled = true }
    dependencies {
        testImplementation project(':common')
        testImplementation 'com.mysql:mysql-connector-j'
        testImplementation 'com.fasterxml.jackson.core:jackson-databind'
        testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    }
    tasks.named('test') {
        onlyIf { System.getenv('FTGO_E2E_ENABLED') == 'true' }
        systemProperty 'ftgo.e2e.gateway-url', System.getenv('FTGO_E2E_GATEWAY_URL') ?: 'http://localhost:8080'
        systemProperty 'ftgo.e2e.order-url', System.getenv('FTGO_E2E_ORDER_URL') ?: 'http://localhost:8081'
        systemProperty 'ftgo.e2e.consumer-url', System.getenv('FTGO_E2E_CONSUMER_URL') ?: 'http://localhost:8082'
        systemProperty 'ftgo.e2e.restaurant-url', System.getenv('FTGO_E2E_RESTAURANT_URL') ?: 'http://localhost:8083'
        systemProperty 'ftgo.e2e.kitchen-url', System.getenv('FTGO_E2E_KITCHEN_URL') ?: 'http://localhost:8084'
        systemProperty 'ftgo.e2e.jdbc-url', System.getenv('FTGO_E2E_JDBC_URL') ?: 'jdbc:mysql://localhost:33306'
    }
}

wrapper {
    gradleVersion = '8.14.3'
    distributionType = Wrapper.DistributionType.ALL
}
