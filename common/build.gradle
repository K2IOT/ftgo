// Common module - shared DTOs, value objects, and test fixtures
// This module is a library, not a Spring Boot application

apply plugin: 'java-test-fixtures'

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'io.eventuate.tram.core:eventuate-tram-commands'
    implementation 'org.apache.kafka:kafka-clients'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.micrometer:micrometer-core'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-web'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    testFixturesImplementation 'org.junit.jupiter:junit-jupiter-api'
    testFixturesImplementation 'io.eventuate.tram.core:eventuate-tram-commands'
    testFixturesImplementation 'org.testcontainers:mysql:1.19.3'
    testFixturesImplementation 'org.springframework:spring-jdbc'
    testFixturesImplementation 'org.flywaydb:flyway-core'
    testFixturesImplementation 'org.flywaydb:flyway-mysql'
    testFixturesRuntimeOnly 'com.mysql:mysql-connector-j'
}
