name: Phase 05 Observability Context

on:
  pull_request:
    branches: [dev]
    paths:
      - 'common/src/main/java/net/ftgo/common/observability/**'
      - 'common/src/main/java/net/ftgo/common/messaging/**'
      - 'common/src/test/java/net/ftgo/common/observability/**'
      - 'api-gateway/src/main/java/net/ftgo/gateway/observability/**'
      - 'api-gateway/src/test/java/net/ftgo/gateway/observability/**'
      - '**/src/main/java/**/messaging/DomainEventPublisher.java'
      - 'order-history-service/src/main/java/net/ftgo/orderhistory/messaging/**'
      - 'deployment/observability/**'
      - 'deployment/kubernetes/**'
      - 'docker/service.Dockerfile'
      - 'docs/runbooks/tracing.md'
      - 'build.gradle'
      - '.github/workflows/phase-05-observability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-05-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correlation-context-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh
      - name: Run trace and correlation context contracts
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :common:test \
            --tests 'net.ftgo.common.observability.CorrelationContext*Test' \
            --stacktrace
