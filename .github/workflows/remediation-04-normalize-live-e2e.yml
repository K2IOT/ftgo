name: Remediation 04 Normalize Live E2E

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/remediation-04-normalize-live-e2e.yml'

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/remediation-04-order-api-idempotency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remediation-04-order-api-idempotency
          fetch-depth: 0
      - name: Fix schema assertion and formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('e2e-tests/src/test/java/net/ftgo/e2e/OrderMutationIdempotencyE2ETest.java')
          text = path.read_text(encoding='utf-8')

          old_schema = '''            "eventuate",
            "SELECT COUNT(*) FROM saga_instance WHERE saga_type LIKE '%CreateOrderSaga%' "'''
          new_schema = '''            "ftgo_order",
            "SELECT COUNT(*) FROM saga_instance WHERE saga_type LIKE '%CreateOrderSaga%' "'''
          if text.count(old_schema) != 1:
              raise SystemExit(f'expected one saga schema assertion, found {text.count(old_schema)}')
          text = text.replace(old_schema, new_schema)

          method_pattern = re.compile(
              r'    private void verifyDroppedResponseRetryReplaysCommittedMutation\(Fixture fixture\)\s*'
              r'throws Exception \{.*?\n\}\n\nprivate void postAndDropResponse\(.*?\n\}\n',
              re.DOTALL,
          )
          replacement = '''    private void verifyDroppedResponseRetryReplaysCommittedMutation(Fixture fixture)
        throws Exception {
        ObjectNode request = orderRequest(fixture, 1, 5);
        String key = "remediation-04-dropped-response-" + UUID.randomUUID();

        postAndDropResponse(request, fixture.consumerToken(), key);
        HttpResponse<String> retry = postOrder(
            ORDER_URL,
            request,
            fixture.consumerToken(),
            key
        );

        assertThat(retry.statusCode()).isEqualTo(201);
        long orderId = parse(retry.body()).path("orderId").asLong();
        assertSingleMutationArtifacts(orderId, key);
    }

    private void postAndDropResponse(
        JsonNode request,
        String token,
        String idempotencyKey
    ) throws Exception {
        URI uri = URI.create(ORDER_URL);
        int port = uri.getPort() > 0 ? uri.getPort() : 80;
        byte[] payload = JSON.writeValueAsBytes(request);
        String headers = "POST /orders HTTP/1.1\\r\\n"
            + "Host: " + uri.getHost() + ":" + port + "\\r\\n"
            + "Authorization: Bearer " + token + "\\r\\n"
            + "Idempotency-Key: " + idempotencyKey + "\\r\\n"
            + "Content-Type: application/json\\r\\n"
            + "Content-Length: " + payload.length + "\\r\\n"
            + "Connection: close\\r\\n\\r\\n";

        try (Socket socket = new Socket(uri.getHost(), port);
             OutputStream output = socket.getOutputStream()) {
            output.write(headers.getBytes(StandardCharsets.US_ASCII));
            output.write(payload);
            output.flush();
            Thread.sleep(100L);
        }
    }
'''
          text, matches = method_pattern.subn(replacement, text)
          if matches != 1:
              raise SystemExit(f'expected one dropped-response method block, found {matches}')

          text = text.replace(
              'import java.sql.ResultSet;\nimport java.nio.charset.StandardCharsets;\n',
              'import java.nio.charset.StandardCharsets;\nimport java.sql.ResultSet;\n'
          )
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/remediation-04-normalize-live-e2e.yml').unlink()
          PY
      - name: Commit normalized E2E
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e-tests/src/test/java/net/ftgo/e2e/OrderMutationIdempotencyE2ETest.java \
            .github/workflows/remediation-04-normalize-live-e2e.yml
          git commit -m 'test: correct remediation 04 live database assertions'
          git push origin HEAD:agent/remediation-04-order-api-idempotency
