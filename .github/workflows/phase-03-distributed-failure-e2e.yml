name: Phase 03 Distributed Failure E2E

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-03-distributed-failure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distributed-failure-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Gradle wrapper and harness contracts
        shell: bash
        run: |
          bash scripts/ci/verify-gradle-wrapper.sh
          bash -n scripts/smoke/verify-distributed-consistency.sh
          docker compose \
            -f deployment/tests/docker-compose.core-order-flow.yml \
            config --quiet

      - name: Run two clean-state distributed failure cycles
        id: failure_e2e
        shell: bash
        run: |
          set +e
          chmod +x gradlew scripts/smoke/verify-distributed-consistency.sh
          timeout 95m bash scripts/smoke/verify-distributed-consistency.sh --runs 2 \
            2>&1 | tee phase03-distributed-failure-e2e.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload distributed failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase03-distributed-failure-e2e-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            phase03-distributed-failure-e2e.log
            distributed-consistency-e2e-logs/**
            e2e-tests/build/reports/tests/**
            e2e-tests/build/test-results/**

      - name: Preserve distributed failure result
        if: always()
        shell: bash
        run: exit '${{ steps.failure_e2e.outputs.status }}'
