name: Phase 01 Debezium CDC Smoke

on:
  push:
    branches:
      - agent/ftgo-phase-01-runtime-foundation
    paths:
      - '.github/workflows/phase-01-debezium-smoke.yml'
      - 'deployment/configure-debezium.sh'
      - 'deployment/debezium/connectors/**'
      - 'deployment/tests/docker-compose.debezium-smoke.yml'
      - 'deployment/tests/run-debezium-smoke.sh'
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/phase-01-debezium-smoke.yml'
      - 'deployment/configure-debezium.sh'
      - 'deployment/debezium/connectors/**'
      - 'deployment/tests/docker-compose.debezium-smoke.yml'
      - 'deployment/tests/run-debezium-smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-01-debezium-cdc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run MySQL to Debezium to Kafka smoke
        shell: bash
        run: bash deployment/tests/run-debezium-smoke.sh
      - name: Upload CDC smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debezium-cdc-smoke-diagnostics
          if-no-files-found: warn
          path: |
            deployment/tests/debezium-smoke-record.txt
            deployment/tests/debezium-smoke-containers.log
