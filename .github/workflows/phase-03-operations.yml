name: Phase 03 Operations Reconciliation

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-03-operations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  saga-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle 8.5 wrapper checksum
        run: bash scripts/ci/verify-gradle-wrapper.sh
      - name: Run saga and outbox operations contracts
        id: gradle
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          timeout 10m ./gradlew --no-daemon \
            :order-service:test \
            --tests 'net.ftgo.order.operations.OrderOperationReconcilerTest' \
            --stacktrace --info 2>&1 | tee phase03-operations.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload operations diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase03-operations-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            phase03-operations.log
            order-service/build/reports/tests/**
            order-service/build/test-results/**
      - name: Preserve operations result
        if: always()
        shell: bash
        run: exit '${{ steps.gradle.outputs.status }}'
