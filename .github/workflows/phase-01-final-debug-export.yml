name: Phase 01 Final Debug Export

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/phase-01-final-debug-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Upload final debug sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-01-final-debug-sources
          path: |
            api-gateway/src/test/java/net/ftgo/gateway/resilience/CircuitBreakerIntegrationTest.java
            consumer-service/src/main/**
            consumer-service/src/test/**
            consumer-service/build.gradle
            deployment/tests/run-debezium-smoke.sh
            deployment/tests/docker-compose.fresh-stack.yml
            scripts/smoke/fresh-stack.sh
