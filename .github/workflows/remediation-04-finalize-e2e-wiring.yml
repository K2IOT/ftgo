name: Remediation 04 Finalize E2E Wiring

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/remediation-04-finalize-e2e-wiring.yml'

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/remediation-04-order-api-idempotency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remediation-04-order-api-idempotency
          fetch-depth: 0
      - name: Apply verified wiring patches
        run: |
          python - <<'PY'
          from pathlib import Path

          distributed = Path('e2e-tests/src/test/java/net/ftgo/e2e/DistributedConsistencyTest.java')
          text = distributed.read_text(encoding='utf-8')
          bad = '''        if ((ORDER_URL + "/orders").equals(url)) {
          builder.header("Idempotency-Key", "distributed-consistency-" + UUID.randomUUID());
          }
          '''
          good = '''        if ((ORDER_URL + "/orders").equals(url)) {
              builder.header("Idempotency-Key", "distributed-consistency-" + UUID.randomUUID());
          }
          '''
          if text.count(bad) != 1:
              raise SystemExit(f'expected one distributed indentation match, found {text.count(bad)}')
          distributed.write_text(text.replace(bad, good), encoding='utf-8')

          smoke = Path('scripts/smoke/verify-core-order-flow.sh')
          script = smoke.read_text(encoding='utf-8')
          anchor = "    --tests 'net.ftgo.e2e.CoreOrderFlowTest' \\\n"
          addition = anchor + "    --tests 'net.ftgo.e2e.OrderMutationIdempotencyE2ETest' \\\n"
          if script.count(anchor) != 1:
              raise SystemExit(f'expected one core E2E test anchor, found {script.count(anchor)}')
          smoke.write_text(script.replace(anchor, addition), encoding='utf-8')

          Path('.github/workflows/remediation-04-finalize-e2e-wiring.yml').unlink()
          PY
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e-tests/src/test/java/net/ftgo/e2e/DistributedConsistencyTest.java \
            scripts/smoke/verify-core-order-flow.sh \
            .github/workflows/remediation-04-finalize-e2e-wiring.yml
          git commit -m 'test: wire remediation 04 live idempotency coverage'
          git push origin HEAD:agent/remediation-04-order-api-idempotency
