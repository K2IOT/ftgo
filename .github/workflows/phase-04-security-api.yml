name: Phase 04 Security and API

on:
  pull_request:
    branches: [dev]
    paths:
      - 'common/**'
      - 'api-gateway/**'
      - 'order-service/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - 'kitchen-service/**'
      - 'accounting-service/**'
      - 'delivery-service/**'
      - 'order-history-service/**'
      - 'e2e-tests/**'
      - 'deployment/tests/test_phase04_*.py'
      - '.github/workflows/phase-04-security-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-04-security-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-architecture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Verify resource server architecture contract
        run: python -m unittest deployment.tests.test_phase04_resource_server_contract -v

      - name: Compile gateway and every HTTP service
        run: |
          ./gradlew \
            :common:compileJava \
            :api-gateway:compileJava \
            :order-service:compileJava \
            :consumer-service:compileJava \
            :restaurant-service:compileJava \
            :kitchen-service:compileJava \
            :accounting-service:compileJava \
            :delivery-service:compileJava \
            :order-history-service:compileJava \
            --no-daemon --stacktrace

      - name: Verify shared JWT principal contract
        run: ./gradlew :common:test --tests '*FtgoJwtAuthenticationConverterTest' --no-daemon --stacktrace

      - name: Upload shared security diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-04-shared-security-diagnostics
          if-no-files-found: warn
          path: |
            common/build/reports/tests/**
            common/build/test-results/**

  service-security-smoke:
    name: service-security-smoke (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - consumer-service
          - restaurant-service
          - kitchen-service
          - accounting-service
          - delivery-service
          - order-history-service
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Verify resource server behavior
        run: ./gradlew :${{ matrix.service }}:test --tests '*SecuritySmokeTest' --no-daemon --stacktrace

      - name: Upload service security diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-04-${{ matrix.service }}-security-diagnostics
          if-no-files-found: warn
          path: |
            ${{ matrix.service }}/build/reports/tests/**
            ${{ matrix.service }}/build/test-results/**

  order-ownership-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Verify order ownership and trusted consumer identity
        run: |
          ./gradlew :order-service:test \
            --tests '*OrderAuthorizationServiceTest' \
            --tests '*OrderControllerIdentityTest' \
            --no-daemon --stacktrace

      - name: Upload order ownership diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-04-order-ownership-diagnostics
          if-no-files-found: warn
          path: |
            order-service/build/reports/tests/**
            order-service/build/test-results/**

  consumer-ownership-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Verify consumer ownership and privileged credit policy
        run: |
          ./gradlew :consumer-service:test \
            --tests '*ConsumerAuthorizationServiceTest' \
            --tests '*ConsumerControllerAuthorizationTest' \
            --tests '*ConsumerAdminControllerTest' \
            --no-daemon --stacktrace

      - name: Upload consumer ownership diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-04-consumer-ownership-diagnostics
          if-no-files-found: warn
          path: |
            consumer-service/build/reports/tests/**
            consumer-service/build/test-results/**
