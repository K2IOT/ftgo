name: Phase 02B Payment Settlement

on:
  pull_request:
    branches: [dev]
    paths:
      - 'accounting-service/**'
      - 'common/**'
      - 'order-service/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - 'kitchen-service/**'
      - 'e2e-tests/**'
      - 'deployment/tests/**'
      - 'scripts/smoke/verify-payment-settlement.sh'
      - '.github/workflows/phase-02b-payment-settlement.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase-02b-payment-settlement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accounting-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Verify Kafka-backed settlement redelivery
        run: |
          ./gradlew :accounting-service:test \
            --tests 'net.ftgo.accounting.messaging.SettlementKafkaRedeliveryIntegrationTest' \
            --tests 'net.ftgo.accounting.config.SettlementKafkaRedeliveryLoadTest' \
            --no-daemon --stacktrace

      - name: Verify accounting settlement
        run: ./gradlew :accounting-service:clean :accounting-service:test --no-daemon --stacktrace

      - name: Verify shared payment contracts
        run: ./gradlew :common:test :order-service:test --no-daemon --stacktrace

      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-02b-unit-diagnostics
          if-no-files-found: warn
          path: |
            accounting-service/build/reports/tests/**
            accounting-service/build/test-results/**
            order-service/build/reports/tests/**
            order-service/build/test-results/**

  payment-settlement-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FTGO_E2E_ENABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Verify Docker Compose model
        run: docker compose -f deployment/tests/docker-compose.core-order-flow.yml config --quiet

      - name: Run two clean-state payment settlement cycles
        shell: bash
        run: |
          chmod +x gradlew scripts/smoke/verify-payment-settlement.sh
          set +e
          bash scripts/smoke/verify-payment-settlement.sh --runs 2 \
            >/tmp/payment-settlement-e2e.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo 'PAYMENT_E2E_JUNIT_FAILURES'
            python3 scripts/ci/summarize-junit-failures.py e2e-tests || true
            echo 'PAYMENT_E2E_RUNNER_TAIL'
            tail -n 120 payment-settlement-e2e-logs/runner.log 2>/dev/null || true
            echo 'PAYMENT_E2E_SERVICE_ERRORS'
            grep -R -E 'ERROR|Exception|Caused by:|401|403|409|500' \
              payment-settlement-e2e-logs/run-*/*.log 2>/dev/null | tail -n 80 || true
            echo 'PAYMENT_E2E_COMMAND_TAIL'
            tail -n 120 /tmp/payment-settlement-e2e.log || true
          else
            echo 'Payment settlement E2E completed successfully.'
          fi
          exit "$status"

      - name: Upload settlement diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-02b-payment-settlement-e2e-diagnostics
          if-no-files-found: warn
          path: |
            payment-settlement-e2e-logs/**
            e2e-tests/build/reports/tests/**
            e2e-tests/build/test-results/**

  payment-e2e-failure-summary:
    needs: payment-settlement-e2e
    if: ${{ always() && needs.payment-settlement-e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download diagnostics from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(curl --silent --fail \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            | jq -r '.artifacts[] | select(.name == "phase-02b-payment-settlement-e2e-diagnostics") | .id' \
            | head -n 1)"
          test -n "${artifact_id}"
          curl --silent --show-error --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output diagnostics.zip
          unzip -q diagnostics.zip -d diagnostics

      - name: Print concise payment failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path("diagnostics")
          print("PAYMENT_FAILURE_SUMMARY")
          found = False
          for xml_path in sorted(root.rglob("TEST-*.xml")):
              try:
                  suite = ET.parse(xml_path).getroot()
              except ET.ParseError:
                  continue
              for case in suite.findall("testcase"):
                  failure = case.find("failure")
                  error = case.find("error")
                  node = failure if failure is not None else error
                  if node is None:
                      continue
                  found = True
                  print(f"FAILED_TEST {case.get('classname')}#{case.get('name')}")
                  message = (node.get("message") or "").replace("\n", " ")
                  print(f"MESSAGE {message[:1000]}")
                  text = (node.text or "").splitlines()
                  for line in text[:12]:
                      print(f"DETAIL {line[:1000]}")

          runner_logs = sorted(root.rglob("runner.log"))
          if runner_logs:
              lines = runner_logs[-1].read_text(encoding="utf-8", errors="replace").splitlines()
              interesting = [
                  line for line in lines
                  if re.search(r"failed: status=|AssertionError|expected:|but was:|Conflicting idempotency|FAILED", line, re.I)
              ]
              for line in interesting[-20:]:
                  print(f"RUNNER {line[:1000]}")
          if not found:
              print("NO_JUNIT_FAILURE_FOUND")
          PY
