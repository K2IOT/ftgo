name: Phase 02B Payment Settlement

on:
  pull_request:
    branches: [dev]
    paths:
      - 'accounting-service/**'
      - 'common/**'
      - 'order-service/**'
      - 'e2e-tests/**'
      - '.github/workflows/phase-02b-payment-settlement.yml'
  workflow_dispatch:

jobs:
  accounting-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify accounting settlement
        run: ./gradlew :accounting-service:clean :accounting-service:test --no-daemon --stacktrace
      - name: Verify shared payment contracts
        run: ./gradlew :common:test :order-service:test --no-daemon --stacktrace
