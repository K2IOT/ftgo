name: Remediation 04 Order Idempotency

on:
  pull_request:
    branches: [dev]
    paths:
      - 'order-service/**'
      - 'deployment/tests/test_phase04_order_idempotency_contract.py'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'scripts/ci/verify-gradle-wrapper.sh'
      - '.github/workflows/remediation-04-order-idempotency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify Gradle 8.14.3 wrapper checksum
        run: bash scripts/ci/verify-gradle-wrapper.sh
      - name: Verify migration contract
        run: python -m unittest deployment.tests.test_phase04_order_idempotency_contract -v
      - name: Verify focused idempotency tests
        run: ./gradlew :order-service:test --tests '*Idempotency*Test' --no-daemon --stacktrace
