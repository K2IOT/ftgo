name: Phase 01 Module Diagnostics

on:
  push:
    branches:
      - agent/ftgo-phase-01-runtime-foundation
    paths:
      - '.github/workflows/phase-01-module-diagnostics.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'scripts/ci/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'common/**'
      - 'api-gateway/**'
      - 'order-service/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - 'kitchen-service/**'
      - 'accounting-service/**'
      - 'delivery-service/**'
      - 'order-history-service/**'
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/phase-01-module-diagnostics.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'scripts/ci/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'common/**'
      - 'api-gateway/**'
      - 'order-service/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - 'kitchen-service/**'
      - 'accounting-service/**'
      - 'delivery-service/**'
      - 'order-history-service/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-01-module-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-test:
    name: module-${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module:
          - accounting-service
          - api-gateway
          - consumer-service
          - kitchen-service
          - order-history-service
          - order-service
          - restaurant-service
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Gradle 8.5 wrapper checksum
        run: ./scripts/ci/verify-gradle-wrapper.sh

      - name: Install Gradle 8.5
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Run module tests with detailed output
        id: gradle
        shell: bash
        run: |
          set +e
          timeout 20m gradle :${{ matrix.module }}:clean :${{ matrix.module }}:test \
            --stacktrace --info 2>&1 | tee module-test.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Bundle diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp module-test.log diagnostics/
          if [ -d '${{ matrix.module }}/build/test-results' ]; then
            cp -R '${{ matrix.module }}/build/test-results' diagnostics/test-results
          fi
          if [ -d '${{ matrix.module }}/build/reports/tests' ]; then
            cp -R '${{ matrix.module }}/build/reports/tests' diagnostics/test-reports
          fi
          tar -czf '${{ matrix.module }}-diagnostics.tar.gz' diagnostics

      - name: Upload module diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-${{ matrix.module }}-diagnostics
          path: ${{ matrix.module }}-diagnostics.tar.gz

      - name: Preserve Gradle result
        if: always()
        shell: bash
        run: exit '${{ steps.gradle.outputs.status }}'
