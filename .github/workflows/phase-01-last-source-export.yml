name: Phase 01 Last Source Export

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/phase-01-last-source-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Upload target sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-01-last-sources
          path: |
            api-gateway/src/main/resources/application.yml
            api-gateway/src/test/java/net/ftgo/gateway/resilience/CircuitBreakerIntegrationTest.java
            api-gateway/src/test/java/net/ftgo/gateway/resilience/RateLimitingIntegrationTest.java
            accounting-service/src/main/java/net/ftgo/accounting/domain/Account.java
            .github/workflows/phase-01-verification.yml
