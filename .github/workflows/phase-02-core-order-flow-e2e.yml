name: Phase 02 Core Order Flow E2E

on:
  push:
    branches:
      - agent/phase-02-core-order-flow
    paths:
      - '.github/workflows/phase-02-core-order-flow-e2e.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'common/**'
      - 'order-service/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - 'kitchen-service/**'
      - 'accounting-service/**'
      - 'e2e-tests/**'
      - 'deployment/tests/**'
      - 'scripts/smoke/verify-core-order-flow.sh'
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/phase-02-core-order-flow-e2e.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'common/**'
      - 'order-service/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - 'kitchen-service/**'
      - 'accounting-service/**'
      - 'e2e-tests/**'
      - 'deployment/tests/**'
      - 'scripts/smoke/verify-core-order-flow.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-02-core-order-flow-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-order-flow-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Verify Docker Compose model
        run: docker compose -f deployment/tests/docker-compose.core-order-flow.yml config --quiet

      - name: Run two clean-state core order flow cycles
        shell: bash
        run: |
          chmod +x gradlew scripts/smoke/verify-core-order-flow.sh
          set +e
          bash scripts/smoke/verify-core-order-flow.sh --runs 2 \
            >/tmp/core-order-flow-e2e.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo 'CORE_E2E_JUNIT_FAILURES'
            python3 scripts/ci/summarize-junit-failures.py e2e-tests || true
            echo 'CORE_E2E_RUNNER_TAIL'
            tail -n 160 core-order-flow-e2e-logs/runner.log 2>/dev/null || true
            echo 'CORE_E2E_SERVICE_ERRORS'
            grep -R -E 'ERROR|Exception|Caused by:|401|403|409|500' \
              core-order-flow-e2e-logs/run-*/*.log 2>/dev/null | tail -n 120 || true
            echo 'CORE_E2E_COMMAND_TAIL'
            tail -n 160 /tmp/core-order-flow-e2e.log || true
          else
            echo 'Core order flow E2E completed successfully.'
          fi
          exit "$status"

      - name: Upload core order flow diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-02-core-order-flow-e2e-diagnostics
          if-no-files-found: warn
          path: |
            core-order-flow-e2e-logs/**
            e2e-tests/build/reports/tests/**
            e2e-tests/build/test-results/**
