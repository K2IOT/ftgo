name: Phase 02 Core Order Flow E2E

on:
  push:
    branches:
      - agent/phase-02-core-order-flow
    paths:
      - '.github/workflows/phase-02-core-order-flow-e2e.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'common/**'
      - 'order-service/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - 'kitchen-service/**'
      - 'accounting-service/**'
      - 'e2e-tests/**'
      - 'deployment/tests/**'
      - 'scripts/smoke/verify-core-order-flow.sh'
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/phase-02-core-order-flow-e2e.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'common/**'
      - 'order-service/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - 'kitchen-service/**'
      - 'accounting-service/**'
      - 'e2e-tests/**'
      - 'deployment/tests/**'
      - 'scripts/smoke/verify-core-order-flow.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase-02-core-order-flow-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-order-flow-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Verify Docker Compose model
        run: docker compose -f deployment/tests/docker-compose.core-order-flow.yml config --quiet

      - name: Run two clean-state core order flow cycles
        shell: bash
        run: |
          chmod +x gradlew scripts/smoke/verify-core-order-flow.sh
          set +e
          bash scripts/smoke/verify-core-order-flow.sh --runs 2 \
            >/tmp/core-order-flow-e2e.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo 'CORE_E2E_JUNIT_FAILURES'
            python3 scripts/ci/summarize-junit-failures.py e2e-tests || true
            echo 'CORE_E2E_RUNNER_TAIL'
            tail -n 160 core-order-flow-e2e-logs/runner.log 2>/dev/null || true
            echo 'CORE_E2E_SERVICE_ERRORS'
            grep -R -E 'ERROR|Exception|Caused by:|401|403|409|500|503' \
              core-order-flow-e2e-logs/run-*/*.log 2>/dev/null | tail -n 160 || true
            echo 'CORE_E2E_COMMAND_TAIL'
            tail -n 160 /tmp/core-order-flow-e2e.log || true
          else
            echo 'Core order flow E2E completed successfully.'
          fi
          exit "$status"

      - name: Upload core order flow diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-02-core-order-flow-e2e-diagnostics
          if-no-files-found: warn
          path: |
            core-order-flow-e2e-logs/**
            e2e-tests/build/reports/tests/**
            e2e-tests/build/test-results/**

  core-e2e-failure-summary:
    needs: core-order-flow-e2e
    if: ${{ always() && needs.core-order-flow-e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download diagnostics from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(curl --silent --fail \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            | jq -r '.artifacts[] | select(.name == "phase-02-core-order-flow-e2e-diagnostics") | .id' \
            | head -n 1)"
          test -n "${artifact_id}"
          curl --silent --show-error --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output diagnostics.zip
          unzip -q diagnostics.zip -d diagnostics

      - name: Print concise core failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path("diagnostics")
          print("CORE_FAILURE_SUMMARY")
          found = False
          for xml_path in sorted(root.rglob("TEST-*.xml")):
              try:
                  suite = ET.parse(xml_path).getroot()
              except ET.ParseError:
                  continue
              for case in suite.findall("testcase"):
                  node = case.find("failure")
                  if node is None:
                      node = case.find("error")
                  if node is None:
                      continue
                  found = True
                  print(f"FAILED_TEST {case.get('classname')}#{case.get('name')}")
                  message = (node.get("message") or "").replace("\n", " ")
                  print(f"MESSAGE {message[:1200]}")
                  for line in (node.text or "").splitlines()[:14]:
                      print(f"DETAIL {line[:1200]}")

          runner_logs = sorted(root.rglob("runner.log"))
          if runner_logs:
              lines = runner_logs[-1].read_text(encoding="utf-8", errors="replace").splitlines()
              interesting = [
                  line for line in lines
                  if re.search(r"failed: status=|AssertionError|expected:|but was:|FAILED|did not become", line, re.I)
              ]
              for line in interesting[-30:]:
                  print(f"RUNNER {line[:1200]}")

          service_pattern = re.compile(
              r"ERROR|Exception|Caused by:|Jwt|JWK|Connection refused|Unsupported|\b500\b|\b503\b",
              re.I,
          )
          for service_name in ("order-service.log", "api-gateway.log"):
              service_logs = sorted(root.rglob(service_name))
              if not service_logs:
                  continue
              path = service_logs[-1]
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              matches = [line for line in lines if service_pattern.search(line)]
              print(f"SERVICE_LOG {path}")
              for line in matches[-40:]:
                  print(f"SERVICE {line[:1600]}")
              print(f"SERVICE_TAIL {service_name}")
              for line in lines[-20:]:
                  print(f"TAIL {line[:1600]}")

          if not found:
              print("NO_JUNIT_FAILURE_FOUND")
          PY
