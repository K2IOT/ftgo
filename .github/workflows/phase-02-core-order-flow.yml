name: Phase 02 Core Order Flow

on:
  push:
    branches:
      - agent/phase-02-core-order-flow
    paths:
      - '.github/workflows/phase-02-core-order-flow.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - 'scripts/ci/**'
      - 'common/**'
      - 'restaurant-service/**'
      - 'consumer-service/**'
      - 'kitchen-service/**'
      - 'accounting-service/**'
      - 'order-service/**'
      - 'e2e-tests/**'
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/phase-02-core-order-flow.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'build.gradle'
      - 'settings.gradle'
      - 'scripts/ci/**'
      - 'common/**'
      - 'restaurant-service/**'
      - 'consumer-service/**'
      - 'kitchen-service/**'
      - 'accounting-service/**'
      - 'order-service/**'
      - 'e2e-tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-02-core-order-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Run full test suite
        id: gradle
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          timeout 40m ./gradlew --no-daemon clean test --stacktrace --continue 2>&1 | tee phase-02-test.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-02-core-order-flow-diagnostics
          if-no-files-found: warn
          path: |
            phase-02-test.log
            build/wrapper-verification.txt
            '**/build/reports/tests/**'
            '**/build/test-results/**'

      - name: Preserve Gradle result
        if: always()
        shell: bash
        run: exit '${{ steps.gradle.outputs.status }}'
