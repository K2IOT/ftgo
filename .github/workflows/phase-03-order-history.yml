name: Phase 03 Order History Consistency

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-03-order-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  out-of-order-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle 8.14.3 wrapper checksum
        run: bash scripts/ci/verify-gradle-wrapper.sh
      - name: Run out-of-order recovery contracts
        id: gradle
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          timeout 10m ./gradlew --no-daemon \
            :order-history-service:test \
            --tests 'net.ftgo.orderhistory.messaging.OutOfOrderEventIntegrationTest' \
            --stacktrace --info 2>&1 | tee phase03-order-history-recovery.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase03-order-history-recovery-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            phase03-order-history-recovery.log
            order-history-service/build/reports/tests/**
            order-history-service/build/test-results/**
      - name: Preserve recovery result
        if: always()
        shell: bash
        run: exit '${{ steps.gradle.outputs.status }}'

  paging-access-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTGO_ORDER_HISTORY_PAGING_SECRET: test-order-history-paging-secret-32-bytes
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle 8.14.3 wrapper checksum
        run: bash scripts/ci/verify-gradle-wrapper.sh
      - name: Run signed paging and access-pattern contracts
        id: gradle
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          timeout 10m ./gradlew --no-daemon \
            :order-history-service:test \
            --tests 'net.ftgo.orderhistory.service.OrderHistoryPagingTokenCodecTest' \
            --tests 'net.ftgo.orderhistory.service.OrderHistoryQueryServicePagingSecurityTest' \
            --tests 'net.ftgo.orderhistory.service.CassandraOrderHistoryQueryStoreTest' \
            --tests 'net.ftgo.orderhistory.api.OrderHistoryPagingTokenMvcTest' \
            --tests 'net.ftgo.orderhistory.api.OrderHistoryPagingIntegrationTest' \
            --stacktrace --info 2>&1 | tee phase03-order-history-paging.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload paging diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase03-order-history-paging-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            phase03-order-history-paging.log
            order-history-service/build/reports/tests/**
            order-history-service/build/test-results/**
      - name: Preserve paging result
        if: always()
        shell: bash
        run: exit '${{ steps.gradle.outputs.status }}'
