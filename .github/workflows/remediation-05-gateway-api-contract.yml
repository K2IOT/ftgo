name: Remediation 05 Gateway API Contract

on:
  pull_request:
    branches: [dev]
    paths:
      - 'common/**'
      - 'api-gateway/**'
      - 'kitchen-service/**'
      - 'accounting-service/**'
      - 'order-history-service/**'
      - '.github/workflows/remediation-05-gateway-api-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify Gateway identity and correlation contracts
        run: >-
          ./gradlew :api-gateway:test
          --tests '*SecurityResponseHeadersFilterTest'
          --tests '*GatewayCorrelationFilterTest'
          --tests '*GatewaySecurityProblemDetailTest'
          --tests '*GatewayProblemDetailContractTest'
          --no-daemon --stacktrace
      - name: Verify service problem-detail contracts
        run: >-
          ./gradlew :kitchen-service:test :accounting-service:test :order-history-service:test
          --tests '*ProblemDetailContractTest'
          --no-daemon --stacktrace
      - name: Verify shared problem-detail regression
        run: ./gradlew :common:test --tests '*ProblemDetailContractTest' --no-daemon --stacktrace
