name: Phase 01 Verification

on:
  push:
    branches:
      - agent/ftgo-phase-01-runtime-foundation
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-red-green:
    name: migration-${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: order-service
            test: OrderMigrationTest
          - module: kitchen-service
            test: KitchenMigrationTest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run migration test
        run: ./gradlew :${{ matrix.module }}:test --tests '*${{ matrix.test }}' --stacktrace --info

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-${{ matrix.module }}-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ matrix.module }}/build/reports/tests/**
            ${{ matrix.module }}/build/test-results/**
