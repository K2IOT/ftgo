name: Phase 01 Verification

on:
  push:
    branches:
      - agent/ftgo-phase-01-runtime-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Phase 01 migration tests
        run: >-
          ./gradlew
          :order-service:test --tests '*OrderMigrationTest'
          :kitchen-service:test --tests '*KitchenMigrationTest'
          --stacktrace
