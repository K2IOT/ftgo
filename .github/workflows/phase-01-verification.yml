name: Phase 01 Verification

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify runner executes shell steps
        run: echo runner-ready

  debezium-connector-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run Debezium connector contract tests
        shell: bash
        run: |
          python3 -m unittest deployment/tests/test_debezium_connectors.py 2>&1 | tee debezium-contract.log
      - name: Upload Debezium diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debezium-connector-contract-diagnostics
          path: debezium-contract.log

  phase02a-rollout-preflight-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run Phase 02A rollout preflight contract tests
        shell: bash
        run: |
          python3 -m unittest deployment/tests/test_phase02a_rollout_preflight.py 2>&1 | tee phase02a-rollout-preflight.log
      - name: Upload rollout preflight diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase02a-rollout-preflight-diagnostics
          path: phase02a-rollout-preflight.log

  migration-red-green:
    name: migration-${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: order-service
            test: OrderMigrationTest
          - module: kitchen-service
            test: KitchenMigrationTest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle 8.14.3 wrapper checksum
        run: bash scripts/ci/verify-gradle-wrapper.sh
      - name: Run migration test and capture output
        id: gradle
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          timeout 10m ./gradlew --no-daemon :${{ matrix.module }}:test --tests '*${{ matrix.test }}' --stacktrace --info 2>&1 | tee gradle-output.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-${{ matrix.module }}-diagnostics-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            gradle-output.log
            build/wrapper-verification.txt
            ${{ matrix.module }}/build/reports/tests/**
            ${{ matrix.module }}/build/test-results/**
      - name: Preserve Gradle result
        if: always()
        shell: bash
        run: exit '${{ steps.gradle.outputs.status }}'

  order-context-wiring:
    name: order-context-wiring
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle 8.14.3 wrapper checksum
        run: bash scripts/ci/verify-gradle-wrapper.sh
      - name: Run order context and saga topology tests
        id: gradle
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          timeout 10m ./gradlew --no-daemon :order-service:test \
            --tests 'net.ftgo.order.config.OrderProductionSchemaContextTest' \
            --tests 'net.ftgo.order.config.SagaBeanUniquenessTest' \
            --tests 'net.ftgo.order.saga.CreateOrderSagaRollingUpgradeTest' \
            --stacktrace --info 2>&1 | tee gradle-output.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload context diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: order-context-wiring-diagnostics-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            gradle-output.log
            build/wrapper-verification.txt
            order-service/build/reports/tests/**
            order-service/build/test-results/**
      - name: Preserve Gradle result
        if: always()
        shell: bash
        run: exit '${{ steps.gradle.outputs.status }}'

  pickup-address-contracts:
    name: pickup-snapshot-${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: common
            test: net.ftgo.common.orderflow.OrderMenuValidatedPickupAddressContractTest
          - module: restaurant-service
            test: net.ftgo.restaurant.service.OrderMenuValidationServiceTest
          - module: order-service
            test: net.ftgo.order.saga.OrderPickupAddressPersistenceTest
          - module: delivery-service
            test: net.ftgo.delivery.messaging.DeliveryPickupAddressIntegrationTest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle 8.14.3 wrapper checksum
        run: bash scripts/ci/verify-gradle-wrapper.sh
      - name: Run pickup snapshot contract test
        id: gradle
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          timeout 12m ./gradlew --no-daemon :${{ matrix.module }}:test --tests '${{ matrix.test }}' --stacktrace --info 2>&1 | tee gradle-output.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pickup-snapshot-${{ matrix.module }}-diagnostics-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            gradle-output.log
            build/wrapper-verification.txt
            ${{ matrix.module }}/build/reports/tests/**
            ${{ matrix.module }}/build/test-results/**
      - name: Preserve Gradle result
        if: always()
        shell: bash
        run: exit '${{ steps.gradle.outputs.status }}'
