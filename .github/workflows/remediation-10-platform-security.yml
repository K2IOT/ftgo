name: Remediation 10 Platform Security

on:
  pull_request:
    branches: [dev]
    paths:
      - 'build.gradle'
      - '*/build.gradle'
      - 'gradle/**'
      - 'scripts/ci/verify-supported-dependencies.sh'
      - 'docs/operations/spring-platform-upgrade-runbook.md'
      - 'deployment/tests/test_supported_dependency_baseline.py'
      - '.github/workflows/remediation-10-platform-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remediation-10-platform-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-vulnerability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle 8.14.3 wrapper checksum
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Generate dependency insight
        run: bash scripts/ci/verify-supported-dependencies.sh | tee dependency-insight.log

      - name: Build executable jars for vulnerability analysis
        run: ./gradlew bootJar --no-daemon --stacktrace

      - name: Fail on HIGH or CRITICAL dependency vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remediation-10-platform-security-evidence
          if-no-files-found: warn
          path: dependency-insight.log
