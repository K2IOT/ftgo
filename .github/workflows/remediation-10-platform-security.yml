name: Remediation 10 Platform Security

on:
  pull_request:
    branches: [dev]
    paths:
      - 'build.gradle'
      - '*/build.gradle'
      - 'gradle/**'
      - 'scripts/ci/verify-supported-dependencies.sh'
      - 'scripts/ci/verify-trivy-java-report.py'
      - 'docs/operations/spring-platform-upgrade-runbook.md'
      - 'deployment/tests/test_supported_dependency_baseline.py'
      - '.github/workflows/remediation-10-platform-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remediation-10-platform-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-vulnerability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle 8.14.3 wrapper checksum
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Generate dependency insight
        run: bash scripts/ci/verify-supported-dependencies.sh | tee dependency-insight.log

      - name: Build executable jars for vulnerability analysis
        run: ./gradlew bootJar --no-daemon --stacktrace

      - name: Stage executable jars for Trivy rootfs analysis
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/trivy-rootfs
          mkdir -p build/trivy-rootfs
          modules=(
            api-gateway
            accounting-service
            consumer-service
            delivery-service
            kitchen-service
            order-service
            order-history-service
            restaurant-service
          )
          count=0
          for module in "${modules[@]}"; do
            mapfile -t jars < <(
              find "$module/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print
            )
            if (( ${#jars[@]} == 0 )); then
              echo "No executable jar found for ${module}" >&2
              exit 1
            fi
            for jar in "${jars[@]}"; do
              cp "$jar" build/trivy-rootfs/
              count=$((count + 1))
            done
            echo "staged_module=${module} jars=${#jars[@]}"
          done
          echo "staged_boot_jars=${count}"

      - name: Fail on HIGH or CRITICAL dependency vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'rootfs'
          scan-ref: 'build/trivy-rootfs'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'json'
          output: 'trivy-results.json'
          list-all-pkgs: 'true'

      - name: Verify Trivy scanned Java dependencies
        if: always()
        run: python scripts/ci/verify-trivy-java-report.py trivy-results.json

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remediation-10-platform-security-evidence
          if-no-files-found: warn
          path: |
            dependency-insight.log
            trivy-results.json
