name: Dev Merge Verification

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-merge-verification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-merge-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact dev SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record merge SHA
        shell: bash
        run: |
          echo "Verifying dev merge SHA: ${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh
      - name: Run full Gradle verification
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test --stacktrace
      - name: Run repository contract matrix
        shell: bash
        run: python3 -m unittest discover -s deployment/tests -p 'test_*.py' -v
