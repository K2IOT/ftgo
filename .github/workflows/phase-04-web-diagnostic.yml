name: Phase 04 Web Diagnostic

on:
  pull_request:
    branches: [dev]
    paths:
      - 'common/**'
      - 'api-gateway/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - '.github/workflows/phase-04-web-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-04-web-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-failure-summary:
    name: regression-failure-summary (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module:
          - common
          - consumer-service
          - restaurant-service
          - api-gateway
    steps:
      - name: Run isolated module and print concise failures
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.pull_request.head.ref }}" \
            https://github.com/${{ github.repository }}.git repository >/dev/null 2>&1
          cd repository
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          set +e
          case "${{ matrix.module }}" in
            common)
              ./gradlew :common:test --tests '*ProblemDetailContractTest' \
                --no-daemon --console=plain >/tmp/module-test.log 2>&1
              ;;
            api-gateway)
              ./gradlew :api-gateway:test --tests '*OrderDetailsControllerTest' \
                --no-daemon --console=plain >/tmp/module-test.log 2>&1
              ;;
            *)
              ./gradlew :${{ matrix.module }}:test \
                --no-daemon --console=plain >/tmp/module-test.log 2>&1
              ;;
          esac
          status=$?
          set -e

          python3 - "${{ matrix.module }}" <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          module = sys.argv[1]
          failures = []
          for filename in sorted(glob.glob(f"{module}/build/test-results/test/*.xml")):
              root = ET.parse(filename).getroot()
              for testcase in root.iter("testcase"):
                  failure = testcase.find("failure")
                  if failure is None:
                      failure = testcase.find("error")
                  if failure is not None:
                      failures.append((testcase, failure))

          print(f"FAILURE_COUNT {len(failures)}")
          if failures:
              testcase, failure = failures[0]
              print(f"FAILED_TEST {testcase.attrib.get('classname', '')}#{testcase.attrib.get('name', '')}")
              message = failure.attrib.get("message", "")
              if message:
                  print(f"MESSAGE {message[:1200]}")
              body_lines = (failure.text or "").splitlines()
              causes = [
                  line.strip() for line in body_lines
                  if any(marker in line for marker in (
                      "Caused by:", "BeanCreationException", "UnsatisfiedDependencyException",
                      "NoSuchBeanDefinitionException", "IllegalArgumentException:",
                      "ConnectException", "BindException"
                  ))
              ]
              for line in causes[-30:]:
                  print(f"ROOT_CAUSE {line[:1600]}")
              print("STACK_TAIL")
              for line in body_lines[-35:]:
                  print(line[:1600])
          PY

          echo "GRADLE_EXIT $status"
          if [ "$status" -ne 0 ]; then
            grep -E '(^| )error:|FAILED|FAILURE:|Execution failed|Compilation failed|Could not|Caused by:' \
              /tmp/module-test.log | tail -n 60 || true
            exit "$status"
          fi
