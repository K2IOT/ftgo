name: Phase 04 Web Diagnostic

on:
  pull_request:
    branches: [dev]
    paths:
      - 'common/**'
      - 'api-gateway/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - 'delivery-service/**'
      - 'scripts/ci/summarize-junit-failures.py'
      - '.github/workflows/phase-04-web-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-04-web-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-failure-summary:
    name: regression-failure-summary (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - common
          - consumer-service
          - restaurant-service
          - delivery-service
          - api-gateway
    steps:
      - name: Run isolated module and print concise failures
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.pull_request.head.ref }}" \
            https://github.com/${{ github.repository }}.git repository >/dev/null 2>&1
          cd repository
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          set +e
          case "${{ matrix.module }}" in
            common)
              ./gradlew :common:test --no-daemon --console=plain >/tmp/module-test.log 2>&1
              ;;
            *)
              ./gradlew :${{ matrix.module }}:test \
                --no-daemon --console=plain >/tmp/module-test.log 2>&1
              ;;
          esac
          status=$?
          set -e

          echo "GRADLE_EXIT $status"
          python3 scripts/ci/summarize-junit-failures.py "${{ matrix.module }}" || true
          if [ "$status" -ne 0 ]; then
            echo 'GRADLE_FAILURE_TAIL'
            grep -E '(^| )error:|FAILED|FAILURE:|Execution failed|Compilation failed|Could not|Caused by:' \
              /tmp/module-test.log | tail -n 80 || true
            exit "$status"
          fi

  gateway-hardening-summary:
    name: gateway-hardening-summary (${{ matrix.test }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test:
          - DownstreamTokenRelayTest
          - ForwardedHeaderPolicyTest
          - GatewayHardeningIntegrationTest
          - OrderDetailsControllerUnitTest
    steps:
      - name: Run focused gateway test and print concise failure
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.pull_request.head.ref }}" \
            https://github.com/${{ github.repository }}.git repository >/dev/null 2>&1
          cd repository
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          set +e
          ./gradlew :api-gateway:test --tests '*${{ matrix.test }}' \
            --no-daemon --console=plain >/tmp/gateway-test.log 2>&1
          status=$?
          set -e

          echo "GRADLE_EXIT $status"
          python3 scripts/ci/summarize-junit-failures.py api-gateway || true
          if [ "$status" -ne 0 ]; then
            grep -E '(^| )error:|FAILED|FAILURE:|Execution failed|Compilation failed|Could not|Caused by:' \
              /tmp/gateway-test.log | tail -n 50 || true
            exit "$status"
          fi
