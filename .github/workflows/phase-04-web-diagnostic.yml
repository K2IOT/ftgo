name: Phase 04 Web Diagnostic

on:
  pull_request:
    branches: [dev]
    paths:
      - 'common/**'
      - 'api-gateway/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - '.github/workflows/phase-04-web-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-04-web-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-web-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh
      - name: Verify shared web contract
        run: |
          ./gradlew :common:test --tests '*ProblemDetailContractTest' \
            --no-daemon --console=plain --stacktrace

  regression-failure-summary:
    name: regression-failure-summary (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module:
          - consumer-service
          - restaurant-service
          - api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh
      - name: Run module and print concise failures
        shell: bash
        run: |
          set +e
          ./gradlew :${{ matrix.module }}:test \
            --no-daemon --console=plain >/tmp/module-test.log 2>&1
          status=$?
          set -e

          python3 - "${{ matrix.module }}" <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          module = sys.argv[1]
          count = 0
          for filename in sorted(glob.glob(f"{module}/build/test-results/test/*.xml")):
              root = ET.parse(filename).getroot()
              for testcase in root.iter("testcase"):
                  failure = testcase.find("failure")
                  if failure is None:
                      failure = testcase.find("error")
                  if failure is None:
                      continue
                  count += 1
                  class_name = testcase.attrib.get("classname", "")
                  test_name = testcase.attrib.get("name", "")
                  message = failure.attrib.get("message", "")
                  body = (failure.text or "").strip()
                  print(f"FAILED_TEST {class_name}#{test_name}")
                  if message:
                      print(f"MESSAGE {message[:1200]}")
                  if body:
                      print(body[:3000])
          print(f"FAILURE_COUNT {count}")
          PY

          if [ "$status" -ne 0 ]; then
            echo "GRADLE_EXIT $status"
            grep -E '(^| )error:|FAILED|FAILURE:|Execution failed|Compilation failed|Could not|Caused by:' \
              /tmp/module-test.log | tail -n 120 || true
            exit "$status"
          fi
