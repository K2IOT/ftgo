name: Phase 04 Web Diagnostic

on:
  pull_request:
    branches: [dev]
    paths:
      - 'common/**'
      - '.github/workflows/phase-04-web-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-04-web-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-web-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Print isolated shared web failure
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.pull_request.head.ref }}" \
            https://github.com/${{ github.repository }}.git repository >/dev/null 2>&1
          cd repository
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          if ./gradlew :common:test --tests '*ProblemDetailContractTest' \
              --no-daemon --console=plain >/tmp/web-contract.log 2>&1; then
            echo 'shared web contract passed'
          else
            grep -E '(^| )error:|FAILED|FAILURE:|Execution failed|Compilation failed|Could not|Caused by:|expected:|but was:' \
              /tmp/web-contract.log | tail -n 160
            exit 1
          fi
