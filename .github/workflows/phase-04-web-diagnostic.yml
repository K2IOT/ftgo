name: Phase 04 Web Diagnostic

on:
  pull_request:
    branches: [dev]
    paths:
      - 'common/**'
      - 'api-gateway/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - '.github/workflows/phase-04-web-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-04-web-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-failure-summary:
    name: regression-failure-summary (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module:
          - common
          - consumer-service
          - restaurant-service
          - api-gateway
    steps:
      - name: Run isolated module and print concise failures
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.pull_request.head.ref }}" \
            https://github.com/${{ github.repository }}.git repository >/dev/null 2>&1
          cd repository
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          set +e
          if [ "${{ matrix.module }}" = "common" ]; then
            ./gradlew :common:test --tests '*ProblemDetailContractTest' \
              --no-daemon --console=plain >/tmp/module-test.log 2>&1
          else
            ./gradlew :${{ matrix.module }}:test \
              --no-daemon --console=plain >/tmp/module-test.log 2>&1
          fi
          status=$?
          set -e

          python3 - "${{ matrix.module }}" <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          module = sys.argv[1]
          count = 0
          for filename in sorted(glob.glob(f"{module}/build/test-results/test/*.xml")):
              root = ET.parse(filename).getroot()
              for testcase in root.iter("testcase"):
                  failure = testcase.find("failure")
                  if failure is None:
                      failure = testcase.find("error")
                  if failure is None:
                      continue
                  count += 1
                  class_name = testcase.attrib.get("classname", "")
                  test_name = testcase.attrib.get("name", "")
                  message = failure.attrib.get("message", "")
                  body = (failure.text or "").strip()
                  print(f"FAILED_TEST {class_name}#{test_name}")
                  if message:
                      print(f"MESSAGE {message[:1000]}")
                  if body:
                      print(body[:1800])
          print(f"FAILURE_COUNT {count}")
          PY

          echo "GRADLE_EXIT $status"
          if [ "$status" -ne 0 ]; then
            grep -E '(^| )error:|FAILED|FAILURE:|Execution failed|Compilation failed|Could not|Caused by:' \
              /tmp/module-test.log | tail -n 60 || true
            exit "$status"
          fi
