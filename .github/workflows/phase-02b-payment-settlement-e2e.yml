name: Phase 02B Payment Settlement E2E

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/phase-02b-payment-settlement-e2e.yml'
      - 'common/**'
      - 'order-service/**'
      - 'consumer-service/**'
      - 'restaurant-service/**'
      - 'kitchen-service/**'
      - 'accounting-service/**'
      - 'e2e-tests/**'
      - 'deployment/tests/**'
      - 'scripts/smoke/verify-payment-settlement.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-02b-payment-settlement-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-settlement-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Gradle wrapper
        run: bash scripts/ci/verify-gradle-wrapper.sh

      - name: Verify Docker Compose model
        run: docker compose -f deployment/tests/docker-compose.core-order-flow.yml config --quiet

      - name: Run payment settlement twice from clean state
        run: |
          chmod +x gradlew scripts/smoke/verify-payment-settlement.sh
          bash scripts/smoke/verify-payment-settlement.sh --runs 2

      - name: Upload payment settlement diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-02b-payment-settlement-e2e-diagnostics
          if-no-files-found: warn
          path: |
            payment-settlement-e2e-logs/**
            e2e-tests/build/reports/tests/**
            e2e-tests/build/test-results/**
