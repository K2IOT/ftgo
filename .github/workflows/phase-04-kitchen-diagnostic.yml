name: Phase 04 Kitchen Diagnostic

on:
  pull_request:
    branches: [dev]
    paths:
      - 'kitchen-service/**'
      - '.github/workflows/phase-04-kitchen-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-04-kitchen-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-kitchen-ownership-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Print isolated kitchen ownership failure
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.pull_request.head.ref }}" \
            https://github.com/${{ github.repository }}.git repository >/dev/null 2>&1
          cd repository
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          if ./gradlew :kitchen-service:test \
              --tests '*TicketAuthorizationServiceTest' \
              --tests '*KitchenServiceAuthorizationTest' \
              --tests '*KitchenControllerAuthorizationTest' \
              --no-daemon --console=plain >/tmp/kitchen-tests.log 2>&1; then
            echo 'kitchen ownership tests passed'
          else
            grep -R -E '<failure|<error' kitchen-service/build/test-results/test || true
            grep -E 'FAILED|expected:|but was:|AssertionError|BUILD FAILED' \
              /tmp/kitchen-tests.log | tail -n 120 || true
            exit 1
          fi
