name: Phase 04 Kitchen Diagnostic

on:
  pull_request:
    branches: [dev]
    paths:
      - 'kitchen-service/**'
      - '.github/workflows/phase-04-kitchen-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-04-kitchen-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-kitchen-ownership-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Print isolated kitchen compiler failure
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.pull_request.head.ref }}" \
            https://github.com/${{ github.repository }}.git repository >/dev/null 2>&1
          cd repository
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          if ./gradlew :kitchen-service:compileTestJava --no-daemon --console=plain \
              >/tmp/kitchen-compile.log 2>&1; then
            echo 'kitchen test compilation passed'
          else
            grep -E '(^| )error:|FAILED|FAILURE:|Execution failed|Compilation failed|Could not' \
              /tmp/kitchen-compile.log | tail -n 120
            exit 1
          fi
