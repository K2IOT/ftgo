name: Phase 01 Source Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ftgo-phase-01-runtime-foundation

permissions:
  contents: read

jobs:
  locate-pickup-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Locate resolver definitions
        shell: bash
        run: |
          set -euo pipefail
          echo 'Locating all resolver definitions on the implementation branch'
          grep -Rni -C 4 'RestaurantPickupAddressResolver\|restaurantServicePickupAddressResolver' \
            delivery-service/src/main/java | tee pickup-resolver-sources.txt
      - name: Upload resolver sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pickup-resolver-sources
          path: pickup-resolver-sources.txt
